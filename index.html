<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grind Colony – Build daily</title>
<link rel="icon" href="logo.jpg">
<meta name="theme-color" content="#0B2A5B">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A5B;--blue:#1E6FD9;--sky:#4FB3F5;--ice:#EEF5FD;--line:#D7E4F4;--red:#E5252A;--yel:#FFC72C;--ink:#0D0D0D;--mut:#5B7090}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 Outfit,system-ui,sans-serif;background:var(--ice);color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn{background:var(--ink);color:var(--yel);font-weight:600;padding:11px 20px;border-radius:999px;box-shadow:0 3px 0 var(--red);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.sm{padding:6px 14px}
.auth{max-width:380px;margin:0 auto;padding:36px 20px;display:grid;gap:14px}
.auth .lg{width:230px;margin:0 auto;mix-blend-mode:multiply}
.tabs{display:flex;background:#fff;border-radius:999px;padding:4px;border:1px solid var(--line)}
.tabs button{flex:1;padding:9px;border-radius:999px;font-weight:600;color:var(--mut)}
.tabs .on{background:var(--navy);color:#fff}
label{display:grid;gap:4px;font-weight:500;font-size:14px}
input,select,textarea{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%}
.err{color:var(--red);min-height:20px;font-size:14px}.note{color:var(--mut);font-size:13px;text-align:center}
.shell{display:grid;grid-template-columns:230px minmax(0,600px) 260px;gap:24px;justify-content:center;padding:0 16px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 0}
.lg2{width:170px;mix-blend-mode:multiply;margin-bottom:14px}
.nv{text-align:left;padding:12px 16px;border-radius:12px;font-weight:600;font-size:18px}
.nv.on{background:var(--navy);color:#fff}.nv:hover:not(.on){background:#fff}
.side .btn{margin-top:14px}
.mid{padding:20px 0 90px;display:grid;gap:14px;align-content:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
h1{font-size:26px;font-weight:700}h2{font-size:17px}
.priv{display:inline-block;background:var(--ink);color:var(--yel);font-size:12px;padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-size:30px;line-height:1}.stats span{font-size:13px;color:var(--mut)}
.comb{margin:14px auto 4px;max-width:340px}
.r{display:flex;gap:3px;margin-top:-3.2%}.r:first-child{margin-top:0}.r:nth-child(even){padding-left:7%}
.c{flex:0 0 13%;aspect-ratio:1/1.12;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line);position:relative}
.c.l1{background:var(--sky)}.c.l2{background:var(--yel)}
.c.today::after{content:'';position:absolute;inset:40%;border-radius:50%;background:var(--ink)}
.hb{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hb span{flex:1;font-weight:500}.hb small{color:var(--mut)}
.tick{width:32px;height:36px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.tick.on{background:var(--yel)}.tick.on::after{content:'✓';font-weight:700;color:var(--ink)}
.x{color:var(--mut);font-size:22px;padding:0 6px}
.add{display:flex;gap:8px;margin-top:10px}
.tabs2{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:-4px}
.tabs2 button{padding:10px 12px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tabs2 .on{color:var(--navy);border-color:var(--blue)}
.comp textarea{border:0;resize:none;min-height:80px;font-size:18px;padding:4px}
.comp .bar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pick{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-weight:500;font-size:14px;cursor:pointer}
.th{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.th div{position:relative}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.th button{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--yel);border-radius:50%;width:20px;height:20px;line-height:20px;font-size:14px}
.post{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.via{font-size:13px;color:var(--mut);margin:0 0 6px 52px;font-weight:500}
.row{display:flex;gap:12px}.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--yel);display:grid;place-items:center;font-weight:700;flex:none}
.thr{flex:1;width:2px;background:var(--line);border-radius:2px;min-height:10px}
.bd{flex:1;min-width:0}.bd header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.role{background:var(--ice);color:var(--blue);font-size:12px;padding:1px 8px;border-radius:6px;font-weight:600}
time{color:var(--mut);font-size:13px;margin-left:auto}
.bd>p{margin:4px 0 8px;white-space:pre-wrap;word-wrap:break-word}
.g{display:grid;gap:3px;border-radius:14px;overflow:hidden;margin-bottom:8px}.g img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.g2,.g3,.g4{grid-template-columns:1fr 1fr}.g3 img:first-child{grid-row:span 2;aspect-ratio:auto}
.acts{display:flex;gap:8px}
.a{padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.a.like.on{background:var(--red);border-color:var(--red);color:#fff}
.a.rs.on{background:var(--yel);border-color:var(--yel)}
.a.cm.on{background:var(--ink);color:var(--yel)}
.cms{margin-top:10px;display:grid;gap:6px;font-size:15px}.cin{display:flex;gap:8px}
.rail{padding-top:28px;position:sticky;top:0;align-self:start;display:grid;gap:14px}
.empty{text-align:center;color:var(--mut);padding:28px}
.av img,img.av{object-fit:cover}.fol{padding:2px 12px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink)}.fol.on{background:var(--ink);color:var(--yel)}
.big{width:84px;height:84px;font-size:32px}.pro{display:flex;gap:16px;align-items:center}
.nt{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.nt:first-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}.lnk{color:var(--blue);font-weight:600;text-decoration:underline;justify-self:start}
.chips{display:flex;flex-wrap:wrap;gap:8px}.seg{display:flex;background:var(--ice);border-radius:999px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:8px;border-radius:999px;font-weight:600}.seg .on{background:var(--ink);color:var(--yel)}
.bar{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;margin-top:8px;font-size:14px}.bar i{height:10px;border-radius:6px;background:var(--yel);justify-self:start}.stats.sm b{font-size:19px}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding:0 12px}.rail,.lg2,.side .btn{display:none}
.side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;background:#fff;border-top:1px solid var(--line);padding:6px;z-index:5}
.nv{flex:1;text-align:center;font-size:13px;padding:10px 2px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
